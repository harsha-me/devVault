name: Keep backend warm

# Render's free tier spins the backend down after ~15 minutes of no traffic,
# and the next request pays a 30-60s cold start (Spring Boot boot time).
# This ping keeps the instance alive around the clock so real users never
# hit that cold start, on login or anywhere else.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 30 https://devvault-1-aeaj.onrender.com/health
