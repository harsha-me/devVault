spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devvault}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

logging.level.root=INFO

logging.level.com.devvault.backend=DEBUG

# Performance Optimization: Disable Lazy Bean Initialization for fast first requests
spring.main.lazy-initialization=false

# Performance Optimization: Hikari Connection Pool Configs
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# AI Companion Config
gemini.api.key=${GEMINI_API_KEY:}

# Weather API Config
weather.api.key=${WEATHER_API_KEY:}
weather.api.provider=${WEATHER_API_PROVIDER:weatherapi}
weather.api.default-city=${WEATHER_API_DEFAULT_CITY:London}

