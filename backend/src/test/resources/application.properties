# Configure database properties for test environment
spring.datasource.url=jdbc:mysql://localhost:3306/devvault
spring.datasource.username=root
spring.datasource.password=

# Specify Dialect explicitly so Hibernate doesn't attempt to connect to determine it
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable DDL schema generation in tests to prevent DDL connection attempts
spring.jpa.hibernate.ddl-auto=none

# Force lazy bean initialization during tests so that the database connection is not eagerly established,
# allowing contextLoads() test to pass even if MySQL/Aiven database is offline.
spring.main.lazy-initialization=true
